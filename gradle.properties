# JVM args for the Gradle daemon. -Xmx capped conservatively for CI parity.
org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC -Dfile.encoding=UTF-8
# Build speed
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache: deferred to a later M0 step (some plugins need auditing first).
org.gradle.configuration-cache=false

# AndroidX
android.useAndroidX=true
# Smaller, faster R classes: each module gets only its own resources.
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
