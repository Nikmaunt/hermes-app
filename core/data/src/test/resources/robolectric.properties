# Robolectric 4.14 does not yet ship an android-all jar for SDK 36; run the
# JVM DAO/schema tests against SDK 34 (installed and supported).
sdk=34
# NATIVE SQLite: the legacy sqlite4java build lacks the unicode61 FTS tokenizer
# (which real Android SQLite on minSdk 31 has). Native mode uses Android's actual
# SQLite so the FTS4 schema — and remove_diacritics folding — is exercised for real.
sqliteMode=NATIVE
